<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UK DB Scheme Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a register ledger. Sticky header with view tabs; overview of coverage, then a dense table with a detail
   panel that slides over from the right. Bottle-green accent on a faintly green-grey paper. */
:root {
  --bg: #f5f7f5; --surface: #ffffff; --sunk: #edf1ee; --fg: #16201b; --muted: #5a6760; --line: #d8dfda;
  --accent: #1d5c4f; --accent-fg: #ffffff; --accent-soft: #dcebe6;
  --good: #2c7a4b; --good-soft: #dff0e5; --warn: #a86a12; --warn-soft: #f7ead3; --bad: #a83a3a; --bad-soft: #f6e0df;
  --dim: #7b8580; --dim-soft: #e7eae8; --dc: #4c6a8a; --dc-soft: #e1e8f0;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-head: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --shadow: 0 10px 30px rgb(10 30 20 / 0.12);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1412; --surface: #161d1a; --sunk: #1c2521; --fg: #e3eae6; --muted: #9aa8a1; --line: #2a3531;
  --accent: #6fbea8; --accent-fg: #0c1310; --accent-soft: #1e3a33;
  --good: #6cc18f; --good-soft: #1b3326; --warn: #e0a64a; --warn-soft: #3a2d17; --bad: #e07c78; --bad-soft: #3c2221;
  --dim: #8d9792; --dim-soft: #232c28; --dc: #8fb0d4; --dc-soft: #1f2b38; --shadow: 0 10px 30px rgb(0 0 0 / 0.5);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1412; --surface: #161d1a; --sunk: #1c2521; --fg: #e3eae6; --muted: #9aa8a1; --line: #2a3531;
  --accent: #6fbea8; --accent-fg: #0c1310; --accent-soft: #1e3a33;
  --good: #6cc18f; --good-soft: #1b3326; --warn: #e0a64a; --warn-soft: #3a2d17; --bad: #e07c78; --bad-soft: #3c2221;
  --dim: #8d9792; --dim-soft: #232c28; --dc: #8fb0d4; --dc-soft: #1f2b38; --shadow: 0 10px 30px rgb(0 0 0 / 0.5);
  color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding-block: 10px; }
h1 { font: 600 20px/1.2 var(--f-head); margin: 0; letter-spacing: 0.01em; }
h1 small { display: block; font: 400 12px/1.4 var(--f-body); color: var(--muted); letter-spacing: 0; }
nav.tabs { display: flex; gap: 4px; margin-left: auto; }
nav.tabs a { font: 500 14px var(--f-head); color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 6px; }
nav.tabs a:hover { background: var(--sunk); color: var(--fg); }
nav.tabs a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
main { padding-block: 20px 48px; }
h2 { font: 600 17px/1.3 var(--f-head); margin: 0 0 10px; text-wrap: balance; }
h3 { font: 600 13px/1.3 var(--f-head); margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.mono { font-family: var(--f-mono); font-size: 12.5px; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.muted { color: var(--muted); }
a { color: var(--accent); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* overview */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; }
.lede { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.stat { padding: 12px 14px; border-left: 3px solid var(--line); background: var(--surface); border-radius: 0 6px 6px 0; }
.stat b { display: block; font: 600 24px/1.15 var(--f-head); font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); }
.stat.g { border-color: var(--good); } .stat.w { border-color: var(--warn); } .stat.b { border-color: var(--bad); } .stat.a { border-color: var(--accent); }
.bar { display: flex; height: 34px; border-radius: 6px; overflow: hidden; margin: 6px 0 4px; }
.bar button { border: 0; padding: 0 8px; cursor: pointer; color: var(--fg); font: 500 12.5px var(--f-head); text-align: left; white-space: nowrap; overflow: hidden; min-width: 0; }
.bar button:hover { filter: brightness(0.96); }
.legend-note { font-size: 12.5px; color: var(--muted); margin: 0 0 16px; }
.cols3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-bottom: 16px; }
.reasons { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.reasons li button { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: baseline; background: none; border: 0; padding: 6px 6px; border-radius: 5px; cursor: pointer; text-align: left; }
.reasons li button:hover { background: var(--sunk); }
.reasons .r-bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--sunk); overflow: hidden; }
.reasons .r-bar i { display: block; height: 100%; }
.g-with_figures { background: var(--good-soft); } .g-no_figures { background: var(--warn-soft); } .g-not_identified { background: var(--bad-soft); }
.g-dc { background: var(--dc-soft); } .g-not_live { background: var(--dim-soft); }
.i-with_figures { background: var(--good); } .i-no_figures { background: var(--warn); } .i-not_identified { background: var(--bad); } .i-dc { background: var(--dc); } .i-not_live { background: var(--dim); }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
svg text { fill: var(--muted); font: 11px var(--f-body); }
svg .axis { stroke: var(--line); }
svg .col { fill: var(--accent); }
svg .col.under { fill: var(--warn); }

/* table views */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-bottom: 12px; }
.filters label { max-width: 100%; display: grid; grid-template-columns: minmax(0, 1fr); gap: 3px; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; min-width: 0; }
.filters input[type=search], .filters select { height: 34px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 0 10px; text-transform: none; letter-spacing: 0; font-size: 13.5px; color: var(--fg); max-width: 100%; }
.filters label.grow { flex: 1 1 260px; max-width: 420px; }
.filters input[type=search] { width: 100%; }
.filters .check { display: flex; align-items: center; gap: 6px; height: 34px; text-transform: none; letter-spacing: 0; font-size: 13.5px; color: var(--fg); }
.btn { height: 34px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 0 12px; cursor: pointer; font-size: 13.5px; }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.resultline { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 99px; padding: 2px 10px; font-size: 12.5px; cursor: pointer; }
.tablebox { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { position: sticky; top: 0; background: var(--sunk); text-align: left; font: 600 12px var(--f-head); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); padding: 8px 10px; white-space: nowrap; border-bottom: 1px solid var(--line); }
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--fg); }
th[aria-sort] { color: var(--accent); }
th[aria-sort="ascending"]::after { content: " ▲"; font-size: 9px; } th[aria-sort="descending"]::after { content: " ▼"; font-size: 9px; }
td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tbody tr { cursor: pointer; }
tbody tr:hover td { background: var(--sunk); }
tbody tr.sel td { background: var(--accent-soft); }
td .sub { display: block; color: var(--muted); font-size: 12px; }
td.name { min-width: 220px; max-width: 380px; }
.pill { display: inline-block; border-radius: 4px; padding: 1px 7px; font: 500 12px/1.6 var(--f-head); white-space: nowrap; }
.pill.with_figures { background: var(--good-soft); color: var(--good); } .pill.no_figures { background: var(--warn-soft); color: var(--warn); }
.pill.not_identified { background: var(--bad-soft); color: var(--bad); } .pill.dc { background: var(--dc-soft); color: var(--dc); } .pill.not_live { background: var(--dim-soft); color: var(--dim); }
.fund { display: inline-flex; align-items: center; gap: 6px; justify-content: flex-end; }
.fund i { display: inline-block; width: 40px; height: 6px; border-radius: 3px; background: var(--sunk); position: relative; overflow: hidden; }
.fund i b { position: absolute; inset: 0 auto 0 0; background: var(--good); }
.fund i b.under { background: var(--warn); }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 10px; font-size: 13px; color: var(--muted); }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); }

/* detail drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); z-index: 40; overflow-y: auto; padding: calc(16px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 20px; transform: translateX(0); transition: transform 0.18s ease; }
.drawer[hidden] { display: block !important; transform: translateX(105%); visibility: hidden; }
.drawer .close { position: sticky; top: 0; float: right; }
.drawer h2 { font-size: 19px; margin-right: 40px; }
.drawer section { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 14px; }
dl.kv { display: grid; grid-template-columns: minmax(120px, 38%) 1fr; gap: 5px 12px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.figs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 4px 0 10px; }
.figs div { background: var(--sunk); border-radius: 6px; padding: 8px 10px; }
.figs b { display: block; font: 600 18px/1.2 var(--f-head); font-variant-numeric: tabular-nums; }
.figs span { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.note { font-size: 12.5px; color: var(--muted); background: var(--sunk); border-radius: 6px; padding: 8px 10px; margin-top: 10px; }
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 0.25); z-index: 35; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; z-index: 50; }
textarea.copybox { width: 100%; height: 120px; font: 12px var(--f-mono); margin-top: 8px; }
@media (max-width: 640px) { nav.tabs { margin-left: 0; } .bar .lbl { display: none; } .figs { grid-template-columns: 1fr 1fr; } td.name { min-width: 180px; } }
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
</style>

<header class="top"><div class="wrap">
  <h1>UK DB Scheme Explorer<small id="built"></small></h1>
  <nav class="tabs" aria-label="Views">
    <a href="#overview" data-view="overview">Overview</a>
    <a href="#schemes" data-view="schemes">Schemes</a>
    <a href="#sponsors" data-view="sponsors">Sponsors</a>
  </nav>
</div></header>

<main class="wrap">
  <section id="v-overview" data-v="overview">
    <div class="lede" id="lede"></div>
    <div class="panel" style="margin-bottom:16px">
      <h2>Live DB and hybrid schemes by status</h2>
      <div class="bar" id="statusbar" role="group" aria-label="Schemes by status"></div>
      <p class="legend-note" id="statusnote"></p>
      <div class="cols3" id="reasoncols"></div>
    </div>
    <div class="cols2">
      <div class="panel"><h2>Funding level of sponsors with figures</h2><p class="legend-note">Assets as a share of the DB obligation, one count per set of figures (a sponsor with several schemes counts once).</p><div id="hist"></div></div>
      <div class="panel"><h2>Largest DB obligations</h2><div class="tablebox" style="border:0"><table id="topten"></table></div></div>
    </div>
  </section>

  <section id="v-schemes" data-v="schemes" hidden>
    <div class="filters">
      <label class="grow">Search<input type="search" id="q" placeholder="Scheme, PSR, postcode, sponsor or company number" autocomplete="off"></label>
      <label>Scope<select id="f-scope">
        <option value="live">Live DB and hybrid</option><option value="all">All schemes</option>
        <option value="dc">DC schemes</option><option value="not_live">Not live</option></select></label>
      <label>Status<select id="f-group"></select></label>
      <label>Reason<select id="f-reason"></select></label>
      <label>Figures from<select id="f-source">
        <option value="">Any</option><option value="own">Sponsor's own accounts</option><option value="group">Parent group</option>
        <option value="register">Charity, union or mutual</option><option value="none">No figures</option></select></label>
      <label>Type<select id="f-type">
        <option value="">Any</option><option value="DB_likely">Name says DB</option><option value="hybrid_likely">Name says hybrid</option>
        <option value="unknown">Name doesn't say</option><option value="DC_likely">Name says DC</option></select></label>
      <label>Size (DB obligation)<select id="f-size"></select></label>
      <label>Sponsor region<select id="f-region"></select></label>
      <label>Sector<select id="f-sector"></select></label>
      <label class="check"><input type="checkbox" id="f-ppf"> PPF or FAS involvement</label>
      <label class="check"><input type="checkbox" id="f-review"> Sponsor match needs review</label>
      <button class="btn" id="reset">Clear filters</button>
    </div>
    <div class="resultline"><span id="count"></span><span class="chips" id="chips"></span><button class="btn" id="copycsv">Copy as CSV</button></div>
    <div class="tablebox"><table id="schemetable"></table></div>
    <div class="pager" id="pager"></div>
    <div id="copyfallback"></div>
  </section>

  <section id="v-sponsors" data-v="sponsors" hidden>
    <div class="filters">
      <label class="grow">Search<input type="search" id="sq" placeholder="Sponsor name or company number" autocomplete="off"></label>
      <label>Show<select id="s-has">
        <option value="fig">Sponsors with figures</option><option value="nofig">Identified, no figures</option><option value="all">All identified sponsors</option></select></label>
    </div>
    <div class="resultline"><span id="scount"></span></div>
    <div class="tablebox"><table id="sponsortable"></table></div>
    <div class="pager" id="spager"></div>
  </section>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Scheme details"></aside>
<div class="toast" id="toast" hidden></div>

<script>
const D = /*__DATA__*/null;
const C = Object.fromEntries(D.cols.map((c, i) => [c, i]));
const S = D.rows.map(r => Object.fromEntries(D.cols.map((c, i) => [c, r[i]])));
const LIVE = ["with_figures", "no_figures", "not_identified"];
const GROUP_ORDER = ["with_figures", "no_figures", "not_identified", "dc", "not_live"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fmtN = n => n.toLocaleString("en-GB");
function money(v) {
  if (v == null || isNaN(v)) return "–";
  const a = Math.abs(v);
  if (a >= 1e9) return "£" + (v / 1e9).toFixed(1) + "bn";
  if (a >= 1e6) return "£" + (v / 1e6).toFixed(a >= 1e8 ? 0 : 1) + "m";
  if (a >= 1e3) return "£" + Math.round(v / 1e3) + "k";
  return "£" + Math.round(v);
}
const fundRatio = s => (s.obligation > 0 && s.assets != null) ? s.assets / s.obligation : null;
const pct = r => r == null ? "–" : Math.round(r * 100) + "%";
const TYPE = {DB_likely: "Name says DB", hybrid_likely: "Name says hybrid", unknown: "Name doesn't say", DC_likely: "Name says DC"};
const SOURCE = {own: "Sponsor's own accounts", group: "Parent group's accounts", register: "Charity, union or mutual accounts"};
const REG = {ccew: "Charity Commission", oscr: "Scottish Charity Regulator", fca: "FCA Mutuals Register", co: "Certification Officer"};
function regLink(reg, no) {
  if (!no) return "";
  if (reg === "ccew") return `https://register-of-charities.charitycommission.gov.uk/charity-search/-/charity-details/${encodeURIComponent(no)}`;
  if (reg === "oscr") return `https://www.oscr.org.uk/about-charities/search-the-register/charity-details?number=${encodeURIComponent(no)}`;
  if (reg === "co") return `https://www.gov.uk/government/collections/${encodeURIComponent(no)}`;
  if (reg === "fca") return `https://mutuals.fca.org.uk/Search/Search?SearchTerm=${encodeURIComponent(no)}`;
  return "";
}
const chLink = no => `https://find-and-update.company-information.service.gov.uk/company/${encodeURIComponent(no)}`;
const isCo = no => no && /^([A-Z]{2}\d{6}|\d{8})$/.test(no);
const bodyLink = (s) => s.source === "register" ? regLink(s.reg, s.fig_body_no) : (isCo(s.fig_body_no) ? chLink(s.fig_body_no) : "");
const searchText = s => [s.name, s.psr, s.postcode, s.city, s.co, s.co_name, s.reg_name, s.reg_number, s.fig_body, s.derived].filter(Boolean).join(" ").toLowerCase();
const BANDS = [["Under £10m", 0, 1e7], ["£10m to £50m", 1e7, 5e7], ["£50m to £250m", 5e7, 2.5e8],
  ["£250m to £1bn", 2.5e8, 1e9], ["£1bn to £5bn", 1e9, 5e9], ["Over £5bn", 5e9, Infinity]];
const NO_FIG = "No figures", NO_SPONSOR = "No sponsor identified", NOT_KNOWN = "Not known";
function band(s) {
  const v = s.group === "with_figures" ? (s.obligation ?? s.assets) : null;
  if (v == null) return NO_FIG;
  return (BANDS.find(([, lo, hi]) => v >= lo && v < hi) || BANDS[0])[0];
}
S.forEach(s => { s._t = searchText(s); s._fr = fundRatio(s); s._band = band(s);
  s._region = s.region || (s.co || s.reg ? NOT_KNOWN : NO_SPONSOR); s._sector = s.sector || (s.co || s.reg ? NOT_KNOWN : NO_SPONSOR); });

// schemes that share a set of figures: the same obligation and assets, whichever company reports them (a company's
// own figures and its subsidiaries' group figures; a subsidiary reporting its parent's scheme)
const figKey = s => !s.source ? null : (s.obligation != null || s.assets != null) ? `${s.obligation}|${s.assets}` : `${s.source}|${s.fig_body_no}`;
const shared = {};
S.forEach(s => { const k = figKey(s); if (k && s.group === "with_figures") shared[k] = (shared[k] || 0) + 1; });

$("#built").textContent = `Built ${D.built} from EIOPA, Companies House, the PPF and FAS, charity and mutual registers and the Certification Officer`;

/* ---------- overview ---------- */
function overview() {
  const live = S.filter(s => LIVE.includes(s.group));
  const cnt = g => S.filter(s => s.group === g).length;
  const figSets = new Map();
  S.filter(s => s.group === "with_figures").forEach(s => { const k = figKey(s); if (!figSets.has(k)) figSets.set(k, s); });
  const sets = [...figSets.values()];
  const tot = (f) => sets.reduce((a, s) => a + (s[f] || 0), 0);
  const ob = tot("obligation"), as = sets.filter(s => s.obligation).reduce((a, s) => a + (s.assets || 0), 0);
  const obWithAssets = sets.filter(s => s.obligation && s.assets != null).reduce((a, s) => a + s.obligation, 0);
  const asWithOb = sets.filter(s => s.obligation && s.assets != null).reduce((a, s) => a + s.assets, 0);
  $("#lede").innerHTML = `
    <div class="stat a"><b>${fmtN(live.length)}</b><span>live DB and hybrid schemes</span></div>
    <div class="stat g"><b>${Math.round(cnt("with_figures") / live.length * 100)}%</b><span>${fmtN(cnt("with_figures"))} with employer and figures</span></div>
    <div class="stat"><b>${money(ob)}</b><span>DB obligations covered, each set of figures once</span></div>
    <div class="stat"><b>${pct(asWithOb / obWithAssets)}</b><span>assets / obligation where both are known</span></div>`;
  const bar = $("#statusbar");
  bar.innerHTML = LIVE.map(g => { const n = cnt(g); const w = n / live.length * 100;
    return `<button class="g-${g}" style="flex:${n} 1 0" data-group="${g}" title="${esc(D.groups[g])}: ${fmtN(n)}">${w > 12 ? `<span class="lbl">${esc(D.groups[g])} · </span>` : ""}${fmtN(n)}</button>`; }).join("");

  const t = e.target.closest("[data-sort],[data-ssort],[data-page],[data-spage],[data-psr],[data-group],[data-scope],[data-clear],tr[data-body]");
  if (!t) return;
  if (t.dataset.sort) { const k = t.dataset.sort; st.dir = st.sort === k ? -st.dir : (["name", "sponsor", "group"].includes(k) ? 1 : -1); st.sort = k; renderSchemes(); }
  else if (t.dataset.ssort) { const k = t.dataset.ssort; sst.dir = sst.sort === k ? -sst.dir : (k === "name" ? 1 : -1); sst.sort = k; renderSponsors(); }
  else if (t.dataset.page) { st.page += +t.dataset.page; renderSchemes(); $("#schemetable").scrollIntoView({block: "start"}); }
  else if (t.dataset.spage) { sst.page += +t.dataset.spage; renderSponsors(); }
  else if (t.dataset.psr) openScheme(t.dataset.psr);
  else if (t.dataset.group) { Object.assign(st, {scope: "live", group: t.dataset.group, reason: t.dataset.reason || "", body: "", page: 0}); $("#f-scope").value = "live"; go("schemes"); }
  else if (t.dataset.scope) { Object.assign(st, {scope: t.dataset.scope, group: "", reason: "", body: "", page: 0}); $("#f-scope").value = t.dataset.scope; go("schemes"); }
  else if (t.dataset.clear) { st[t.dataset.clear] = ""; st.page = 0; renderSchemes(); }
  else if (t.dataset.body) { Object.assign(st, {body: t.dataset.body, scope: "all", group: "", reason: "", page: 0}); $("#f-scope").value = "all"; go("schemes"); }
});
$("#sq").addEventListener("input", e => { sst.q = e.target.value; sst.page = 0; renderSponsors(); });
$("#s-has").addEventListener("change", e => { sst.has = e.target.value; sst.page = 0; renderSponsors(); });
$("#scrim").addEventListener("click", closeDrawer);
document.addEventListener("click", e => { if (e.target.id === "dclose") closeDrawer(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#drawer").hidden) closeDrawer(); });
overview(); route();
</script>
