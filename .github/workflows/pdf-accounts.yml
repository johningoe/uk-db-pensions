# Reads the companies in cloud/todo.json (written by `python run.py cloud-export`) on parallel Linux runners.
# Each runner OCRs its share with Tesseract and uploads one artifact; `python run.py cloud-import` loads them.
name: PDF accounts

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Parallel runners (each uses all its CPU cores)"
        default: "8"
      minutes:
        description: "Stop starting new documents after this many minutes (max ~330)"
        default: "300"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.s.outputs.shards }}
    steps:
      - id: s
        run: echo "shards=$(python3 -c 'import json; print(json.dumps(list(range(int("${{ inputs.jobs }}")))))')" >> "$GITHUB_OUTPUT"

  read:
    needs: plan
    runs-on: ubuntu-24.04             # pinned: the new 26.04 image's package mirrors failed on first use
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
      PENSIONDB_OCR: tesseract
      OMP_THREAD_LIMIT: "1"            # one core per Tesseract call; the worker runs one process per core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install Tesseract (conda-forge; Ubuntu's package mirrors were unreachable from the runners)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: ocr
          create-args: tesseract
          condarc: |
            channels:
              - conda-forge
          cache-environment: true
      - name: Point the reader at Tesseract
        run: |
          echo "TESSERACT_CMD=$MAMBA_ROOT_PREFIX/envs/ocr/bin/tesseract" >> "$GITHUB_ENV"
          echo "TESSDATA_PREFIX=$MAMBA_ROOT_PREFIX/envs/ocr/share/tessdata" >> "$GITHUB_ENV"
          "$MAMBA_ROOT_PREFIX/envs/ocr/bin/tesseract" --version
      - name: Install Python packages
        run: pip install -q -r requirements.txt
      - name: Read accounts
        run: python -m pensiondb.cloud work --shard ${{ matrix.shard }}/${{ inputs.jobs }} --procs "$(nproc)" --minutes ${{ inputs.minutes }} --out out
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: results-${{ matrix.shard }}
          path: out/
          retention-days: 7
